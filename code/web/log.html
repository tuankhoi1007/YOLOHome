<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhật ký hoạt động — Yolo:Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/log.css">
</head>
<body>
  <!-- Figma 7:97 -->
  <header class="log-header">
    <div class="log-header-inner">
      <div class="log-brand">
        <a class="log-logo" href="/">Yolo<span>:</span>Home</a>
        <span class="log-logo-sub">AIoT Smart Living</span>
      </div>
      <nav class="breadcrumb" aria-label="Đường dẫn">
        <a href="/">Trang chủ</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">Nhật ký hoạt động</span>
      </nav>
      <div class="log-user">
        <span class="log-user-text">
          <span class="log-user-name">Chủ nhà</span>
          <button class="log-user-logout" type="button" id="logout">Đăng xuất</button>
        </span>
        <span class="log-avatar" aria-hidden="true">CN</span>
      </div>
    </div>
  </header>

  <main class="log-page">
    <p class="log-eyebrow">System audit trail</p>
    <h1 class="log-title">Lịch Sử Vận Hành &amp; Sự Kiện Thiết Bị</h1>
    <p class="log-lead">Theo dõi hoạt động cảm biến, thiết bị điều khiển, cảnh báo và nhận diện khuôn mặt.</p>

    <div class="card log-filters">
      <div class="pills" id="log-pills" role="tablist" aria-label="Loại sự kiện"></div>
      <div class="log-filter-tools">
        <label class="filter-input">
          <img src="img/icon-calendar.svg" width="16" height="16" alt="">
          <span class="sr-only">Ngày</span>
          <input type="date" id="log-date">
        </label>
        <label class="filter-input filter-search">
          <img src="img/icon-search.svg" width="16" height="16" alt="">
          <span class="sr-only">Tìm kiếm</span>
          <input type="search" id="log-search" placeholder="Tìm kiếm sự kiện…">
        </label>
      </div>
    </div>

    <div class="card log-table-card table-wrap" id="log-table" aria-live="polite"></div>

    <div class="log-pager">
      <p class="log-count" id="log-count"></p>
      <nav class="pager" id="log-pager" aria-label="Trang"></nav>
    </div>
  </main>

  <script type="module" src="js/log.js"></script>
</body>
</html>
